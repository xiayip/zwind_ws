tag_grasp_detector:
  ros__parameters:
    image_topic: /wrist_camera/left_color/image_raw
    camera_info_topic: /wrist_camera/left_color/camera_info
    base_frame: base_link
    tcp_frame: omni_picker_tcp
    grasp_frame: strap_grasp
    # Black-edge length (m) per AprilTag 36h11 ID. The test box carries ID 3 (sheet spec 20 mm);
    # stereo measured ~17 mm on 2026-10-28, i.e. printed scaled. Replace with the ruler value.
    tag_ids: [3]
    tag_sizes: [0.017]
    target_id: -1          # -1: nearest known tag
    strap_axis: x          # tag axis that runs along the strap (tabs of the print sheet are along x)
    grasp_depth: 0.015     # TCP goes this far below the tag surface (m)
    max_rate: 5.0          # Hz, frames in between are skipped
    max_reprojection_error: 2.0
    max_tilt: 45.0         # deg, tag normal vs base z; the strap top faces up, steeper poses are PnP flips
    tf_timeout: 0.1
